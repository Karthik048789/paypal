[build]
  command = "([ -d node_modules/postcss ] || npm ci) && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  SECRETS_SCAN_OMIT_KEYS = "PORT,PAYPAL_MODE,REDIS_URL,KERNEL_CDP_ENDPOINT,LLM_MODEL,PAYPAL_CLIENT_ID,PAYPAL_CLIENT_SECRET,CREDENTIALS_ENCRYPTION_KEY,LLM_API_KEY,KERNEL_API_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

